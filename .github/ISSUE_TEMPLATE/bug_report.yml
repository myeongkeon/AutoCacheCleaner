name: Bug report / 동작 제보
description: 내 기기에서 캐시 삭제가 안 되거나 중간에 멈춰요
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: 기기 / Device
      placeholder: 예) Galaxy S24, One UI 6.1, Android 14
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 어떤 화면에서 멈췄는지, 몇 번째 앱이었는지 등
    validations: { required: true }
  - type: textarea
    id: diag
    attributes:
      label: 진단 정보 / Support info
      description: 앱 홈 화면 맨 아래 [문제 신고용 진단 정보 보내기]로 만든 텍스트를 붙여 넣으세요. 패키지명이 들어 있으니 지우고 싶은 줄은 지워도 됩니다.
      render: text
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 접근성 서비스가 켜져 있고, 사용정보 접근을 허용했습니다
        - label: 정리하는 동안 화면을 끄거나 잠그지 않았습니다
